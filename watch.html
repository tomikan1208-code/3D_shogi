<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三次元将棋 - 観戦モード</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .watch-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }
    .btn-watch {
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-start { background: #2ecc71; color: white; }
    .btn-stop { background: #e74c3c; color: white; }
    .btn-start:hover { background: #27ae60; }
    .btn-stop:hover { background: #c0392b; }
    .btn-start:disabled, .btn-stop:disabled { background: #7f8c8d; cursor: not-allowed; }
    
    input[type="number"], input[type="range"] {
      background: #2c3e50;
      color: white;
      border: 1px solid #34495e;
      padding: 5px;
      border-radius: 4px;
    }
    .seek-container {
      margin-top: 10px;
    }
    .seek-slider {
      width: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="main-wrapper">
    <div id="game-screen" class="screen active">
      <header class="game-header">
        <div class="header-left">
          <a href="index.html" class="back-link">← 戻る</a>
          <span class="header-title">♟ 観戦モード (NPC vs NPC)</span>
        </div>
        <div class="header-center">
          <button class="view-toggle-btn active" id="btn-3d-view">3D</button>
          <button class="view-toggle-btn" id="btn-2d-view">2D</button>
        </div>
        <div class="header-right">
          <div class="turn-display" id="turn-info">—</div>
          <div class="phase-display" id="phase-info">読み込み中...</div>
        </div>
      </header>

      <main class="game-main">
        <div class="canvas-area">
          <div id="container-3d"></div>
          <div id="wrapper-2d" class="hidden" style="display:none;width:100%;height:100%;overflow-y:auto;"></div>
        </div>

        <aside class="side-panel">
          <div class="panel-section">
            <h3>観戦コントロール</h3>
            <div class="watch-controls">
              <div class="control-row">
                <button id="btn-play" class="btn-watch btn-start">再生</button>
                <button id="btn-pause" class="btn-watch btn-stop" disabled>停止</button>
              </div>
              <div class="control-row">
                <label>思考時間(秒):</label>
                <input type="number" id="input-speed" value="0.5" min="0.1" step="0.1" style="width: 60px;">
              </div>
              <div class="seek-container">
                <label>巻き戻し/シーク: <span id="seek-val">0</span> / <span id="max-seek">0</span></label>
                <input type="range" id="seek-slider" class="seek-slider" min="0" max="0" value="0">
                <div class="control-row" style="margin-top: 8px;">
                  <label>手数ジャンプ:</label>
                  <input type="number" id="seek-input" value="0" min="0" step="1" style="width: 80px;">
                  <button id="btn-seek-go" class="btn-watch" style="background:#3498db;color:white;">移動</button>
                </div>
              </div>
            </div>
          </div>

          <div class="panel-section" id="panel-hand">
            <h3 class="hand-label">△ 後手の持ち駒</h3>
            <div class="hand-row" id="hand-row-gote"></div>
            <h3 class="hand-label">▲ 先手の持ち駒</h3>
            <div class="hand-row" id="hand-row-sente"></div>
          </div>

          <div class="panel-section log-area">
            <h3>棋譜ログ</h3>
            <ul id="log-list"></ul>
          </div>
        </aside>
      </main>
    </div>
  </div>

  <script type="module" src="js/watch.js"></script>
</body>
</html>
