<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三次元将棋</title>
  <meta name="description" content="9×9×9の立体空間で戦う三次元将棋。3Dビュー・断面2Dビュー対応。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mode-select-screen">
    <h1><span>♟</span>三次元将棋</h1>
    <p class="mode-subtitle">9 × 9 × 9 の立体盤面で戦う、新感覚の将棋</p>

    <div class="mode-buttons">
      <button class="mode-btn" onclick="location.href='game.html'">
        <span class="icon">🖥️</span>
        1端末対戦
      </button>
      <button class="mode-btn" onclick="location.href='watch.html'">
        <span class="icon">🤖</span>
        NPC対戦を観戦
        <span class="new-tag">NEW</span>
      </button>
      <button class="mode-btn" onclick="location.href='online.html'">
        <span class="icon">🌐</span>
        インターネット対戦
      </button>
      <button class="mode-btn" onclick="location.href='pieces.html'">
        <span class="icon">📖</span>
        駒の動き
      </button>
    </div>
  </div>
</body>
</html>
